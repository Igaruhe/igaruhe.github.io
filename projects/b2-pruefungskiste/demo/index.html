<title>B2 Prüfungskiste (Demo)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a study box — sticky filter bar on top, then either a scannable list or one big flip card. Category colour = which drawer the card comes from. */
:root{
  --bg:#f3f2f1; --paper:#ffffff; --paper-2:#f3f2f1; --ink:#0b0c0c; --muted:#484949; --line:#cecece; --input:#0b0c0c;
  --accent:#2a702c; --accent-ink:#ffffff; --accent-soft:#e3f1df; --mark:#2a702c; --accent-shadow:#173f18;
  --link:#1a65a6; --link-hover:#0f385c; --focus:#ffdd00; --focus-text:#0b0c0c;
  --c-gram:#1a65a6; --c-gram-s:#d2e2f1; --c-nvv:#7a4f00; --c-nvv-s:#f5e6c4; --c-red:#4c2c92; --c-red-s:#e1dbef; --c-ws:#aa2a16; --c-ws-s:#f6d7d2;
  --good:#2a702c; --good-s:#e3f1df; --again:#aa2a16; --again-s:#f6d7d2;
  --f-head:"Helvetica Neue",Helvetica,Arial,sans-serif; --f-ui:"Helvetica Neue",Helvetica,Arial,sans-serif; --f-mono:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1110; --paper:#1a1d1c; --paper-2:#232726; --ink:#f3f2f1; --muted:#b9bbbb; --line:#3f4544; --input:#b9bbbb;
  --accent:#7fcf78; --accent-ink:#0b0c0c; --accent-soft:#1b3a1c; --mark:#9bdc95; --accent-shadow:#3c7a37;
  --link:#8ab8e6; --link-hover:#b9d5f2; --focus:#ffdd00; --focus-text:#0b0c0c;
  --c-gram:#8ab8e6; --c-gram-s:#16283a; --c-nvv:#e6b85a; --c-nvv-s:#382b13; --c-red:#b8a6ec; --c-red-s:#2a2346; --c-ws:#f0907e; --c-ws-s:#3d221e;
  --good:#9bdc95; --good-s:#1b3a1c; --again:#f0907e; --again-s:#3d221e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1110; --paper:#1a1d1c; --paper-2:#232726; --ink:#f3f2f1; --muted:#b9bbbb; --line:#3f4544; --input:#b9bbbb;
  --accent:#7fcf78; --accent-ink:#0b0c0c; --accent-soft:#1b3a1c; --mark:#9bdc95; --accent-shadow:#3c7a37;
  --link:#8ab8e6; --link-hover:#b9d5f2; --focus:#ffdd00; --focus-text:#0b0c0c;
  --c-gram:#8ab8e6; --c-gram-s:#16283a; --c-nvv:#e6b85a; --c-nvv-s:#382b13; --c-red:#b8a6ec; --c-red-s:#2a2346; --c-ws:#f0907e; --c-ws-s:#3d221e;
  --good:#9bdc95; --good-s:#1b3a1c; --again:#f0907e; --again-s:#3d221e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;margin-bottom:14px}
h1{font-family:var(--f-head);font-weight:700;font-size:clamp(1.6rem,4.5vw,2.2rem);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:.88rem;margin:2px 0 0}
.stats{display:flex;gap:14px;font:500 .78rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--good);font-weight:500}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.cat{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 13px;font:600 .86rem var(--f-ui);cursor:pointer;display:flex;gap:6px;align-items:center}
.cat i{width:9px;height:9px;border-radius:50%;background:var(--dot,var(--muted));display:inline-block}
.cat small{font:500 .72rem var(--f-mono);color:var(--muted)}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cat[aria-pressed="true"] small{color:inherit;opacity:.75}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=search]{font:500 .86rem var(--f-ui);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input[type=search]{flex:1 1 180px}
select{flex:0 1 auto;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:var(--paper);color:var(--muted);font:600 .84rem var(--f-ui);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tag{font:500 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;white-space:nowrap}
.t-gram{color:var(--c-gram);background:var(--c-gram-s)} .t-nvv{color:var(--c-nvv);background:var(--c-nvv-s)} .t-red{color:var(--c-red);background:var(--c-red-s)} .t-ws{color:var(--c-ws);background:var(--c-ws-s)}
.meta{font:500 .72rem var(--f-mono);color:var(--muted)}
/* list */
.group{margin-top:22px}
.group h2{font-family:var(--f-head);font-size:1.08rem;margin:0 0 8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.group h2 .meta{font-weight:400}
.list{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
details{border-top:1px solid var(--line)} details:first-child{border-top:0}
summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary .f{flex:1;min-width:0;font-family:var(--f-head);font-size:1.02rem}
summary .st{font:500 .7rem var(--f-mono);color:var(--good)}
summary .st.again{color:var(--again)}
details[open] summary{background:var(--paper-2)}
.body{padding:4px 14px 16px;min-width:0}
.more{display:block;margin:14px auto 0;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 16px;font:600 .86rem var(--f-ui);color:var(--ink);cursor:pointer}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:32px 20px;text-align:center;color:var(--muted);margin-top:20px}
/* back content */
.rule{margin:6px 0 10px}.rule strong{color:var(--mark)}
mark{background:none;color:var(--mark);font-weight:700}
ul.exs,ul.ph{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
ul.exs li{font-family:var(--f-head);background:var(--paper-2);border-radius:7px;padding:8px 11px}
ul.ph li{font-family:var(--f-head);font-size:1.05rem;padding-left:16px;position:relative}
ul.ph li::before{content:"›";position:absolute;left:0;color:var(--c-red);font-weight:700}
.ans{font-family:var(--f-head);font-size:1.15rem}
.mean{font-family:var(--f-head);font-style:italic;color:var(--muted);margin:2px 0 10px}
.ex{margin-top:10px;background:var(--c-red-s);border-radius:7px;padding:8px 11px;font-family:var(--f-head)}
.ex span,.lab{display:block;font:500 .68rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:10px 0 3px}
.ex span{margin-top:0;color:var(--c-red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.box{background:var(--paper-2);border-radius:7px;padding:8px 10px;font-size:.88rem}
.syn{display:flex;flex-wrap:wrap;gap:5px;margin:0}.syn span{background:var(--c-nvv-s);color:var(--c-nvv);border-radius:99px;padding:2px 9px;font-size:.84rem;font-weight:600}
.body p{margin:0}
/* explain */
.explain{margin-top:8px}
.xbtn{border:1px solid var(--c-ws);color:var(--c-ws);background:transparent;border-radius:8px;padding:7px 12px;font:600 .84rem var(--f-ui);cursor:pointer}
.xbtn[disabled]{opacity:.6;cursor:default}
.xout{margin-top:8px;font-size:.92rem}
.xout .lab:first-child{margin-top:0}
.xnote{color:var(--muted);font-size:.84rem;margin-top:6px}
/* cards */
.deck{margin-top:18px;display:flex;flex-direction:column;gap:14px}
.prog{height:5px;background:var(--line);border-radius:5px;overflow:hidden}.prog span{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.scene{perspective:1500px}
.card{position:relative;min-height:360px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--edge,var(--accent));border-radius:10px;padding:22px 22px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.back{transform:rotateY(180deg)}
.face .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.face .top .meta{margin-left:auto}
.prompt{font-family:var(--f-head);font-weight:600;font-size:clamp(1.35rem,4.2vw,1.9rem);line-height:1.25;margin:auto 0;text-wrap:balance}
.hint{color:var(--muted);font-size:.84rem}
.judge{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.judge button{padding:10px 4px;border-radius:9px;border:0;font:700 .92rem var(--f-ui);cursor:pointer}
.b-again{background:var(--again-s);color:var(--again)} .b-good{background:var(--good-s);color:var(--good)}
.b-hard{background:var(--c-nvv-s);color:var(--c-nvv)} .b-easy{background:var(--accent-soft);color:var(--accent)}
.judge button small{display:block;font:500 .7rem var(--f-mono);opacity:.8;margin-top:2px}
ol.hard{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}ol.hard li{display:flex;gap:8px;align-items:baseline;min-width:0}ol.hard .f{flex:1;min-width:0;font-family:var(--f-head);overflow-wrap:anywhere}ol.hard .n{font:500 .74rem var(--f-mono);color:var(--again);white-space:nowrap}
.nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.nav button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:7px 13px;font:600 .84rem var(--f-ui);cursor:pointer}
.keys{text-align:center;color:var(--muted);font-size:.76rem}
kbd{font:500 .7rem var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--paper)}
.sync{font:500 .72rem var(--f-mono);color:var(--muted)}.sync.on{color:var(--good)}
.dash{margin-top:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel.wide{grid-column:1/-1}
.panel h3{margin:0 0 10px;font:600 .74rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--f-head);font-weight:700;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:1rem;color:var(--muted);font-weight:400}
.goalbar{height:12px;background:var(--paper-2);border-radius:6px;overflow:hidden;margin:10px 0 6px}.goalbar span{display:block;height:100%;background:var(--good);border-radius:6px}
.goalbar.today span{background:var(--accent)}
.note{color:var(--muted);font-size:.86rem;margin:4px 0 0}
.catrow{display:grid;grid-template-columns:7.5rem 1fr 4.5rem;gap:10px;align-items:center;margin:7px 0;font-size:.88rem}
.catrow .goalbar{margin:0;height:9px}
.catrow .n{font:500 .74rem var(--f-mono);text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:110px;margin-top:6px}
.days div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px;min-width:0}
.days i{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--good);min-height:2px}
.days i.miss{background:var(--line)}
.days b{font:500 .62rem var(--f-mono);color:var(--muted);font-weight:500}
.days .goalline{position:relative}
.examrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.examrow input{font:500 .9rem var(--f-ui);color:var(--ink);background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
@media (max-width:620px){.dash{grid-template-columns:1fr}.catrow{grid-template-columns:6.5rem 1fr 4rem}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
/* Mobile: the filters fold away behind one "Filter" button so the card stays in view. Desktop is unchanged. */
.mbar,.fsum,.fdone,.tabbar,.ti{display:none}
.ftoggle{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:7px 12px;font:600 .86rem var(--f-ui);cursor:pointer}
.ftoggle .fcount{font:600 .72rem var(--f-mono);background:var(--ink);color:var(--paper);border-radius:999px;padding:1px 7px}
.ftoggle .fcount:empty{display:none}
.ftoggle .chev{width:8px;height:8px;border:solid currentColor;border-width:0 2px 2px 0;transform:translateY(-2px) rotate(45deg);transition:transform .15s}
.ftoggle[aria-expanded="true"] .chev{transform:translateY(1px) rotate(-135deg)}
.fsum{margin:0;font-size:.82rem;color:var(--muted);align-items:baseline;gap:8px}
.fsum span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.fsum b{color:var(--ink);font-weight:600}
.linkbtn{border:0;background:none;padding:2px 0;color:var(--accent);font:600 .82rem var(--f-ui);text-decoration:underline;text-underline-offset:3px;cursor:pointer;flex:0 0 auto}
.fdone{width:100%;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:600 .9rem var(--f-ui);padding:10px 12px;cursor:pointer}
.fdone:disabled{opacity:.55;cursor:default}
.fpanel{display:flex;flex-direction:column;gap:10px}
@media (max-width:620px){
  .mbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .bar:not(.open) .fpanel{display:none}
  .bar.has-f:not(.open) .fsum{display:flex}
  .bar.no-f .mbar .ftoggle,.bar.no-f .fsum{display:none}
  .fdone{display:block}
  .fpanel select{flex:1 1 100%}
  /* card first: smaller header, one-line deck bar, card sized so the rating buttons fit on screen */
  .wrap{padding-top:12px}
  header{margin-bottom:6px;gap:2px 12px}
  .sub{display:none}
  h1{font-size:1.45rem}
  .deck{margin-top:10px;gap:10px}
  .card{min-height:clamp(200px,calc(100svh - 360px),430px)}
  /* bottom tab bar, like a phone app: icon + short label, thumb-reachable */
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px)}
  .tabbar .seg{display:grid;grid-template-columns:repeat(3,1fr);border:0;border-radius:0;margin:0 auto;max-width:520px;width:100%}
  .tabbar .seg button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;min-height:56px;background:none;color:var(--muted);font:600 .72rem var(--f-ui)}
  .tabbar .seg button[aria-pressed="true"]{background:none;color:var(--accent)}
  .tabbar .seg button[aria-pressed="true"] .ti{background:var(--accent-soft)}
  .ti{display:block;width:44px;height:28px;padding:3px 11px;border-radius:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ti circle{fill:currentColor;stroke:none}
  .face{padding:16px}
}
@media (hover:none){.keys{display:none}}
@media (max-width:520px){.grid2{grid-template-columns:1fr}.seg{margin-left:0}.face{padding:18px 16px}}

/* Theme: GOV.UK Design System foundations (text, borders, links, yellow focus, square corners, green primary button, system sans),
   neutral surface header; accent green and focus yellow taken from the icon (60-30-10). No GOV.UK crown, name or Transport font. */
body{font-size:16px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
@media (min-width:641px){body{font-size:19px}}
:is(.cat,select,input,.seg,.tag,.list,.more,.empty,ul.exs li,.ex,.box,.xbtn,.prog,.prog span,.face,.judge button,.nav button,.panel,.goalbar,.goalbar span,.days i,.examrow input,.ftoggle,.fcount,.fdone,.ti,.syn span,kbd){border-radius:0}
html,body{overflow-x:clip}
body{margin:0}
.mast{background:var(--paper);box-shadow:0 0 0 100vmax var(--paper),0 1px 0 100vmax var(--line);clip-path:inset(0 -100vmax -1px);margin:-22px 0 20px;padding:14px 0 12px;align-items:center}
.brandrow{display:flex;gap:14px;align-items:center}
.logo{width:40px;height:40px;flex:0 0 auto;display:block;image-rendering:pixelated}
.mast h1{letter-spacing:0}
h1,.group h2,.prompt,.big{font-weight:700}
.cat{border:2px solid var(--line);font-weight:700}
.cat[aria-pressed="true"]{border-color:var(--ink)}
select,input[type=search],.examrow input{border:2px solid var(--input);padding:6px 8px}
.seg{border:2px solid var(--input)}
.seg button{font-weight:700}
/* button hierarchy: primary = rating buttons / green; secondary = Filter, Mehr (GOV.UK secondary: light, thin edge); tertiary = Zurück/Mischen/Weiter (text only) */
.ftoggle,.more{border:1px solid var(--line);background:var(--paper);font-weight:600;box-shadow:0 2px 0 var(--line)}
.nav{gap:4px}
.nav button{border:0;background:none;box-shadow:none;font-weight:600;color:var(--muted);min-height:44px;padding:8px 14px}
.nav button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.fdone{background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 0 var(--accent-shadow);font-weight:700}
.fdone:hover{filter:brightness(.92)}
.judge button{box-shadow:0 2px 0 currentColor}
.b-easy{background:var(--c-gram-s);color:var(--c-gram)}
.face{border-width:1px;border-left-width:8px}
.tag{letter-spacing:.02em;font-weight:700}
.linkbtn{color:var(--link);text-decoration-thickness:1px}
.linkbtn:hover{color:var(--link-hover);text-decoration-thickness:3px}
.empty{border-style:solid}
/* GOV.UK focus state: yellow background, dark text, thick dark underline */
button:focus-visible,summary:focus-visible,.linkbtn:focus-visible{outline:3px solid transparent;background:var(--focus)!important;color:var(--focus-text)!important;box-shadow:0 -2px var(--focus),0 4px var(--focus-text)!important}
button:focus-visible small,button:focus-visible .ti{color:var(--focus-text)!important;background:none!important}
select:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:0;box-shadow:inset 0 0 0 2px var(--input)}
.card:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.card:focus-visible .face{box-shadow:inset 0 0 0 2px var(--focus-text)}
/* Navigation by task: Üben (default, no filters) · Stöbern (filters, list, "Diese Auswahl üben") · Fortschritt.
   Desktop: a text navigation row under the header. Phones: the same buttons move into the bottom tab bar. */
.bar.no-f{display:none}
.views{border-bottom:1px solid var(--line);margin:-20px 0 4px}
.views .seg{border:0;margin:0;overflow:visible;display:flex;gap:28px}
.views .seg button{background:none;color:var(--ink);padding:12px 0 10px;font-weight:700;box-shadow:none}
.views .seg button:hover{color:var(--link-hover);text-decoration:underline;text-underline-offset:4px}
.views .seg button[aria-pressed="true"]{background:none;color:var(--accent);box-shadow:inset 0 -4px 0 var(--accent)}
.scope{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between;margin:0;font-size:.9rem;color:var(--muted)}
.scope b{color:var(--ink)}
.scope .meta{white-space:nowrap}
.practice{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:18px;background:var(--paper);border:1px solid var(--line);padding:12px 14px}
.practice p{margin:0;color:var(--muted);font-size:.9rem;min-width:0}
.practice p b{color:var(--ink)}
.btn-primary{border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 0 var(--accent-shadow);font:700 .95rem var(--f-ui);padding:10px 16px;min-height:44px;cursor:pointer}
.btn-primary:hover{filter:brightness(.92)}
.empty .btn-primary{margin-top:12px}
@media (max-width:620px){
  .views{display:none}
  .practice{margin-top:12px}

/* card view — spaced repetition (Anki-style, simplified SM-2) */
function P(id){const v=prog[id];if(!v)return null;if(typeof v==="string")return{s:v,r:1,l:v==="again"?1:0,iv:v==="ok"?1:0,e:250,d:today()};return v}
function isOk(id){const p=P(id);return !!p&&p.s==="ok"}
function isDue(id){const p=P(id);return !!p&&p.d<=today()}
function lapses(id){const p=P(id);return p?p.l||0:0}
function computeGoal(){const t=today(),left=ITEMS.filter(i=>!isOk(i.id)).length,lt=(meta.log[t]||{}).l||0,finishBy=addDays(meta.exam,-7),dte=dayDiff(t,meta.exam);
  if(dte<=0)return 0;const days=dayDiff(t,finishBy)>=0?dayDiff(t,finishBy)+1:Math.max(1,dte);return Math.max(10,Math.ceil((left+lt)/days))}
function nextIv(p,g){const iv=p?p.iv:0,e=p?p.e:250;
  if(g===1)return 0;if(g===2)return Math.max(1,Math.round(iv*1.2));
  if(g===3)return iv===0?1:iv===1?3:Math.round(iv*e/100);return iv===0?4:Math.round(iv*e/100*1.3)}
function ivLabel(n){return n===0?"<1 T":n<30?n+" T":Math.round(n/30)+" M"}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sessPool(){const s=st.sess;if(s.k==="auswahl"){const set=new Set(s.ids);return ITEMS.filter(i=>set.has(i.id))}return ITEMS}
function deckCounts(pool){const due=pool.filter(i=>isDue(i.id)).length,nw=pool.filter(i=>!P(i.id)).length,hard=pool.filter(i=>lapses(i.id)>0).length;
  const lt=(meta.log[today()]||{}).l||0;return{due,nw,hard,newToday:Math.min(nw,Math.max(0,computeGoal()-lt))}}
function buildDeck(){const pool=sessPool(),k=st.sess.k;
  if(k==="heute"){const due=pool.filter(i=>isDue(i.id)).sort((a,b)=>(P(a.id).s==="again"?0:1)-(P(b.id).s==="again"?0:1)||P(a.id).d.localeCompare(P(b.id).d));
    const c=deckCounts(pool);deck=due.concat(shuffle(pool.filter(i=>!P(i.id))).slice(0,c.newToday))}
  else if(k==="schwer")deck=pool.filter(i=>lapses(i.id)>0).sort((a,b)=>lapses(b.id)-lapses(a.id)||P(a.id).e-P(b.id).e);
  else{const dn=new Set(st.sess.done||[]);deck=shuffle(pool.filter(i=>!dn.has(i.id)))}
  di=0;flipped=false}
function renderCards(){
  const pool=sessPool(),k=st.sess.k,c=deckCounts(pool),done=pool.filter(i=>isOk(i.id)).length;
  const pos=deck.length?'<span class="meta">Karte '+(di%deck.length+1)+' / '+deck.length+'</span>':'';
  const end=' <button type="button" class="linkbtn" id="sess-end">Beenden</button>';
  const scope=k==="heute"?'<span><b>Heute</b> · '+c.due+' fällig + '+c.newToday+' neu</span>':
    k==="schwer"?'<span><b>Schwierige Karten</b> · die häufigsten zuerst'+end+'</span>':
    '<span>Auswahl: <b>'+esc(st.sess.label)+'</b> · '+pool.length+' Karten'+end+'</span>';
  let html='<div class="deck"><p class="scope">'+scope+pos+'</p><div class="prog"><span style="width:'+(pool.length?done/pool.length*100:0)+'%"></span></div>';
  if(!deck.length){html+='<div class="empty">'+(k==="heute"?"Für heute ist alles erledigt. Morgen kommen die nächsten Wiederholungen. Mehr üben? Wähl unter <b>Stöbern</b> ein Kapitel oder Thema aus.":k==="schwer"?"Keine schwierigen Karten mehr. Gut gemacht!<br><button type=\"button\" class=\"btn-primary\" id=\"sess-end2\">Zurück zu Heute</button>":"Auswahl geschafft – jede Karte einmal bewertet.<br><button type=\"button\" class=\"btn-primary\" id=\"sess-end2\">Zurück zu Heute</button>")+'</div></div>';$("main").innerHTML=html;wireDeck();return}
  const i=deck[di%deck.length],p=P(i.id);
  const edge="var(--c-"+i.c+")";
  const front=i.c==="red"?'<div class="prompt">'+esc(i.f)+'</div><span class="hint">Sag zwei passende Redemittel laut, dann umdrehen.</span>':
    i.c==="ws"?'<div class="prompt">'+esc(i.f)+'</div><span class="hint">Was bedeutet das? Bilde einen eigenen Satz, dann umdrehen.</span>':
    i.c==="nvv"?'<div class="prompt">'+esc(i.f)+'</div><span class="hint">Bedeutung? Ein Beispielsatz? Dann umdrehen.</span>':
    '<div class="prompt" style="font-size:clamp(1.15rem,3.6vw,1.5rem)">'+esc(i.f)+'</div><span class="hint">'+(i.kind==="Übung"?"Löse die Aufgabe, dann umdrehen.":"Erkläre die Regel mit einem Beispiel, dann umdrehen.")+'</span>';
  const badge=p?(p.l?'<span class="tag t-ws">'+p.l+'× Nochmal</span>':'<span class="tag t-gram">Wiederholung</span>'):'<span class="tag t-nvv">Neu</span>';
  const top='<div class="top"><span class="tag t-'+i.c+'">'+CATNAME[i.c]+(i.kind==="Übung"?" · Übung":"")+'</span>'+badge+'<span class="meta">'+esc(i.b+" · K"+(i.k||"–")+" · "+i.tp)+'</span></div>';

   '<div class="judge"><button type="button" class="b-again" id="g1">Nochmal<small>'+g[0]+'</small></button><button type="button" class="b-hard" id="g2">Schwer<small>'+g[1]+'</small></button><button type="button" class="b-good" id="g3">Gut<small>'+g[2]+'</small></button><button type="button" class="b-easy" id="g4">Leicht<small>'+g[3]+'</small></button></div>'+
   '<div class="nav"><button type="button" id="prev">← Zurück</button><button type="button" id="shuf">Mischen</button><button type="button" id="next">Weiter →</button></div>'+
   '<p class="keys"><kbd>Leertaste</kbd> umdrehen · <kbd>1</kbd>–<kbd>4</kbd> bewerten · <kbd>←</kbd><kbd>→</kbd> blättern</p></div>';

function wireDeck(){
  ["sess-end","sess-end2"].forEach(id=>{const b=$(id);if(b)b.onclick=()=>{st.sess={k:"heute"};refresh()}});
  const c=$("card");if(!c)return;
  c.onclick=e=>{if(e.target.closest(".xbtn"))return;flipped=!flipped;c.classList.toggle("flip",flipped)};
  c.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();c.click()}};
  [1,2,3,4].forEach(n=>$("g"+n).onclick=()=>rate(n));
  $("prev").onclick=()=>{di=(di-1+deck.length)%deck.length;flipped=false;renderCards()};
  $("next").onclick=()=>{di=(di+1)%deck.length;flipped=false;renderCards()};
  $("shuf").onclick=()=>{shuffle(deck);di=0;flipped=false;renderCards()};
}
function rate(g){
  if(!deck.length)return;const k=di%deck.length,i=deck[k],was=P(i.id),t=today();
  const p=was?Object.assign({},was):{s:"new",r:0,l:0,iv:0,e:250,d:t};
  p.iv=nextIv(was,g);p.r=(p.r||0)+1;
  if(g===1){p.l=(p.l||0)+1;p.e=Math.max(130,p.e-20);p.s="again"}
  else{if(g===2)p.e=Math.max(130,p.e-15);if(g===4)p.e+=15;p.s="ok"}
  p.d=addDays(t,p.iv);prog[i.id]=p;
  const L=meta.log[t]||(meta.log[t]={r:0,l:0});L.r++;
  if(g>1&&(!was||was.s!=="ok"))L.l++;if(g===1&&was&&was.s==="ok")L.l=Math.max(0,L.l-1);
  persist();stats();
  if(st.sess.k==="auswahl"&&g>1){(st.sess.done=st.sess.done||[]).push(i.id);saveUI()}
  const card=deck.splice(k,1)[0];
  if(g===1)deck.splice(Math.min(deck.length,k+4),0,card);
  if(di>=deck.length)di=0;
  flipped=false;renderCards();
}
document.addEventListener("keydown",e=>{

    const settle=()=>{if(!first.p&&!first.m){clearTimeout(to);dbRefs={p,m};setSync(true);
      if(Object.keys(prog).length||Object.keys(meta.log).length)persist();}};
    p.onSnapshot(snap=>{const r=snap&&snap.exists?JSON.parse(JSON.stringify(snap.data())):null;const rp=r&&r.prog||{};
      if(first.p){Object.keys(prog).forEach(k=>{if(!(k in rp))rp[k]=prog[k]});first.p=false;prog=rp;store.set("hub-progress-v1",prog);stats();if(st.mode!=="cards")refresh();settle()}
      else if(JSON.stringify(rp)!==JSON.stringify(prog)){prog=rp;store.set("hub-progress-v1",prog);stats();if(st.mode==="stats")renderStats()}},
      ()=>setSync(false,"Sync unterbrochen – lokal gesichert"));
    m.onSnapshot(snap=>{const r=snap&&snap.exists?JSON.parse(JSON.stringify(snap.data())):null;
      if(first.m){if(r){const lg=r.log||{};Object.keys(meta.log).forEach(d=>{if(!lg[d]||(lg[d].r||0)<meta.log[d].r)lg[d]=meta.log[d]});meta={exam:r.exam||meta.exam,log:lg}}first.m=false;store.set("hub-meta-v1",meta);if(st.mode==="stats")renderStats();settle()}
      else if(r&&JSON.stringify(r.log)!==JSON.stringify(meta.log)){meta={exam:r.exam||meta.exam,log:r.log||{}};store.set("hub-meta-v1",meta);if(st.mode==="stats")renderStats()}},
      ()=>setSync(false,"Sync unterbrochen – lokal gesichert"));
  }catch(e){clearTimeout(to);setSync(false,"nur auf diesem Gerät ("+((e&&e.code)||"Fehler")+")")}
})();
(async()=>{try{sampleFn=window.claude&&window.claude.use?await window.claude.use("sample"):null}catch(e){sampleFn=null}
  if(sampleFn===undefined)sampleFn=null;
  document.querySelectorAll(".explain").forEach(el=>{const i=ITEMS.find(x=>x.id===el.dataset.id);if(i)el.innerHTML=explainInner(i)});
})();
})();
</script>
